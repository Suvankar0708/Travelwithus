<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travelwithus | Discover Your Next Journey</title>

    <meta name="description"
          content="Discover beautiful destinations, travel ideas and unforgettable journeys with Travelwithus.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #17202a;
            line-height: 1.6;
        }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid #e8e8e8;
            padding: 15px 20px;
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #087f5b;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        /* HERO */
        .hero {
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 70px 20px;
            background:
                linear-gradient(rgba(0,0,0,0.42), rgba(0,0,0,0.48)),
                url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85")
                center/cover no-repeat;
            color: white;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero h1 {
            font-size: clamp(42px, 9vw, 76px);
            line-height: 1.05;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .hero-button {
            display: inline-block;
            background: #087f5b;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: 700;
            transition: 0.2s;
        }

        .hero-button:hover {
            transform: translateY(-2px);
            background: #066b4d;
        }

        /* SECTION */
        .section {
            max-width: 1100px;
            margin: auto;
            padding: 65px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #69717a;
        }

        /* SEARCH */
        .search-box {
            max-width: 650px;
            margin: 0 auto 40px;
            display: flex;
            background: white;
            border-radius: 50px;
            padding: 7px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 18px;
            font-size: 15px;
            background: transparent;
        }

        .search-box button {
            border: none;
            background: #087f5b;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 7px 25px rgba(0,0,0,0.07);
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card-content h3 {
            font-size: 21px;
            margin-bottom: 6px;
        }

        .location {
            color: #087f5b;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-content p {
            color: #69717a;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .card-button {
            display: inline-block;
            text-decoration: none;
            color: #087f5b;
            font-weight: 700;
            font-size: 14px;
        }

        /* FEATURES */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .feature {
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
        }

        .feature-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }
